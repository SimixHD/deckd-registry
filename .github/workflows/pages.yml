name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and a running one is not cancelled: an index
# that is halfway published is worse than one that is a minute old.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # This job runs the same check `validate` runs, artifact fetches
      # included, so it cannot publish an index `validate` would reject —
      # and it does so without either workflow waiting on the other.
      # `--allow-reserved`: this job only ever runs from a push to `main`
      # or `workflow_dispatch`, both owner-only, and `dev.simix.*` is the
      # registry's own namespace.
      - run: cargo run -p index-tools -- check index.json --allow-reserved
      - run: cargo run -p index-tools -- render index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
