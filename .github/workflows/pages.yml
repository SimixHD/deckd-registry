name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and a running one is not cancelled: an index
# that is halfway published is worse than one that is a minute old.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # `render` refuses a malformed index on its own (see run_render), so
      # this job cannot publish something `validate` would have rejected —
      # even though the two workflows do not wait on each other.
      - run: cargo run -p index-tools -- render index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
